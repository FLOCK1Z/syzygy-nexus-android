name: Validar Android nativo
on:
  push:
    branches: [main, master, 'native/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Testar e gerar candidata nativa
        run: gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease --no-daemon
      - name: Guardar APK para teste no celular
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-APK-TESTE-NATIVO
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Guardar AAB candidato sem assinatura de publicação
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-AAB-CANDIDATO-NAO-ASSINADO
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Resultados de validação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-validacao-android
          path: |
            app/build/reports/
            app/build/test-results/
